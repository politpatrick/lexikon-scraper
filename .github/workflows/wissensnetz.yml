name: Wissensnetz aktualisieren

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"  # täglich 05:00 UTC, nach den alten Workflows

permissions:
  contents: write

concurrency:
  group: wissensnetz
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository klonen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Paket installieren
        run: pip install -e ".[dev]"

      - name: Tests
        run: pytest -q

      - name: Rohseiten abrufen
        run: python -m lexikon archive --raw raw

      - name: Artikel, Wissensnetz und Bericht erzeugen
        run: python -m lexikon build --raw raw --articles articles --graph graph/graph.json --report reports/qualitaet.md

      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add raw articles graph reports
          if git diff --staged --quiet; then
            echo "Keine Änderungen"
          else
            git commit -m "🔄 Wissensnetz aktualisiert"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
